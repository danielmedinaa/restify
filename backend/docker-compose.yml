name: restify

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restify}
      POSTGRES_USER: ${POSTGRES_USER:-restify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin puertos publicados: solo accesible dentro de la red de Docker.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-restify}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-restify}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - media:/app/media
    networks:
      default: {}
      restify-net: {}   # para consultar al panel (http://panel:8000); docker network create restify-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    env_file: .env
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-restify}:${POSTGRES_PASSWORD}@db:5432/restify_test
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      MEDIA_DIR: /tmp/restify-media
      TRUSTED_HOSTS: '["localhost"]'
    command: ["pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  restify-net:
    external: true

volumes:
  pgdata:
  redisdata:
  media:
