# Caddy compartido por dev, pre y pro. Lo instala desplegar.sh en /srv/restify/proxy.
name: restify-proxy

services:
  caddy:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env   # DOMINIO, ACME_EMAIL, CLOUDFLARE_API_TOKEN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados: NO borrar (Let's Encrypt limita las emisiones)
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    networks: [dev, pre, pro]

networks:
  dev: {external: true, name: restify-dev-net}
  pre: {external: true, name: restify-pre-net}
  pro: {external: true, name: restify-pro-net}

volumes:
  caddy_data:
  caddy_config:
