# Actualizaciones de dependencias (y avisos de vulnerabilidades). Los PR van a develop: se prueban en dev antes de llegar a pre y pro.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    target-branch: develop
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /panel
    schedule: {interval: weekly}
    target-branch: develop
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /landing
    schedule: {interval: weekly}
    target-branch: develop
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /front
    schedule: {interval: weekly}
    target-branch: develop
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: [/backend, /front, /panel, /landing, /deploy/proxy]
    schedule: {interval: weekly}
    target-branch: develop
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    target-branch: develop
