name: Pipeline

# develop -> dev · main -> pre · etiqueta v* -> pro (con aprobación manual en el Environment "pro")
# Los pull requests solo corren los tests.
on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ tests
  panel:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: panel}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: panel/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  landing:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: landing}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: landing/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  infra:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: infra}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      # Los tests del agente usan httpx para hablarle por el socket (la versión del panel)
      - run: pip install pytest httpx==0.28.1
      - run: pytest -q

  backend:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - name: Configuración de prueba (valores de ejemplo, no son secretos reales)
        run: |
          cp .env.example .env
          docker network create restify-net
      - run: docker compose --profile test run --rm --build tests

  front:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: front}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: front/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

  # ------------------------------------------------------------------ a qué ambiente va
  contexto:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      entorno: ${{ steps.e.outputs.entorno }}
      etiqueta: ${{ steps.e.outputs.etiqueta }}
    steps:
      - id: e
        run: |
          case "$GITHUB_REF" in
            refs/heads/develop) echo "entorno=dev" >> "$GITHUB_OUTPUT" ;;
            refs/heads/main)    echo "entorno=pre" >> "$GITHUB_OUTPUT" ;;
            refs/tags/v*)       echo "entorno=pro" >> "$GITHUB_OUTPUT" ;;
            *) echo "Referencia no desplegable: $GITHUB_REF"; exit 1 ;;
          esac
          echo "etiqueta=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ imágenes de los clientes (ghcr.io)
  imagenes:
    needs: [panel, landing, infra, backend, front, contexto]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.ref.outputs.api }}
      front: ${{ steps.ref.outputs.front }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          dueno="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/$dueno/restify-api:${{ needs.contexto.outputs.entorno }}-${{ needs.contexto.outputs.etiqueta }}" >> "$GITHUB_OUTPUT"
          echo "front=ghcr.io/$dueno/restify-front:${{ needs.contexto.outputs.entorno }}-${{ needs.contexto.outputs.etiqueta }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.ref.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: front
          push: true
          tags: ${{ steps.ref.outputs.front }}
          # Vacío: el front arma la URL del WebSocket con el dominio de la página (sirve para cualquier ambiente)
          build-args: NEXT_PUBLIC_WS_URL=
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max

  # ------------------------------------------------------------------ despliegue
  desplegar:
    needs: [contexto, imagenes]
    runs-on: ubuntu-24.04
    # Environment dev / pre / pro. En "pro" configura revisores obligatorios (Settings > Environments).
    environment: ${{ needs.contexto.outputs.entorno }}
    permissions:
      contents: read
      packages: read
    env:
      ENTORNO: ${{ needs.contexto.outputs.entorno }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      IMAGEN_API: ${{ needs.imagenes.outputs.api }}
      IMAGEN_FRONT: ${{ needs.imagenes.outputs.front }}
      GHCR_USUARIO: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Llave SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
      - name: Subir el código
        run: ./deploy/subir.sh "$ENTORNO" "restify@$VPS_HOST"
      - name: Desplegar
        run: |
          # Solo producción reinstala el proxy compartido (Caddy)
          PROXY=""; [ "$ENTORNO" = pro ] && PROXY="--proxy"
          # El token de ghcr.io viaja por la entrada estándar (no aparece en procesos ni en logs)
          printf '%s\n' "$GHCR_TOKEN" | ssh "restify@$VPS_HOST" \
            "sudo /srv/restify/$ENTORNO/app/deploy/desplegar.sh $ENTORNO --imagen-api '$IMAGEN_API' --imagen-front '$IMAGEN_FRONT' --ghcr-usuario '$GHCR_USUARIO' $PROXY"
